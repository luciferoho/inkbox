# 墨匣 Inkbox 打包配置（electron-builder）
# 产物输出 release/；安装版 + 便携版（Windows x64 先行）
appId: com.lucifer.inkbox
productName: Inkbox
directories:
  output: release/pkg
  buildResources: build
files:
  - out/**
asar: true
# 托盘图标：打包后进程从 resources/icon.png 读取
extraResources:
  - from: build/icon.png
    to: icon.png
# Win10 磁贴清单：放在 exe 旁覆盖「从图标推导磁贴底色」的默认行为
# （否则近黑图标被推导成浅灰互补色，与深色主题磁贴不协调）。需在快捷方式创建前就位。
# 配套 tile-*.png 为不透明合成磁贴图（墨脊底+居中星形），见清单注释。
extraFiles:
  - from: build/Inkbox.VisualElementsManifest.xml
    to: Inkbox.VisualElementsManifest.xml
  - from: build/tile-150.png
    to: tile-150.png
  - from: build/tile-70.png
    to: tile-70.png
  # 内置插件：随包分发（主进程 builtinRoot 打包后从 resources/ 读取）
  - from: builtin-plugins
    to: builtin-plugins
# Electron 分发走国内镜像（与 .npmrc 一致，构建机离线环境可覆盖）
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # 快捷方式名保持纯产品名：升级安装时 NSIS 会按注册表记录的旧名自动重命名旧 lnk
  shortcutName: Inkbox
  artifactName: ${productName}-${version}-setup.${ext}
  # 未签名告警不影响本地构建；正式分发前再配置签名（M5 后续）
portable:
  artifactName: ${productName}-${version}-portable.${ext}
# 自动更新源：GitHub Releases。推送 v* 标签的 Release（含 .exe 与 .blockmap）
# 即启用应用内更新。注意：私有仓库 electron-updater 无法匿名校验（会静默跳过），
# 需把仓库设为 public，或后续改用带 token 的自建源
publish:
  provider: github
  owner: luciferoho
  repo: inkbox
